<!-- PAGINATION -->

<div
    id="pagination"
    style="
        display:flex;
        justify-content:center;
        align-items:center;
        gap:10px;
        margin-top:12px;
        flex-wrap:wrap;
    "
>

    <button
        onclick="prevPage()"
        class="action-btn"
    >
        Prev
    </button>

    <span id="pageInfo">
        Page 1
    </span>

    <button
        onclick="nextPage()"
        class="action-btn"
    >
        Next
    </button>

</div>

<script>

/* =========================
   QUICK FILTER DATA
========================= */

let quickFilters = {};

/* LOAD ALL JSON */

Promise.all([

    fetch('AIMEXIII.json').then(r => r.json()),
    fetch('NXTR.json').then(r => r.json()),
    fetch('NXTIII.json').then(r => r.json()),
    fetch('GPX.json').then(r => r.json()),
    fetch('Flexa.json').then(r => r.json()),
    fetch('Fujitrax.json').then(r => r.json()),
    fetch('Feeder.json').then(r => r.json()),
    fetch('Nexim.json').then(r => r.json()),
    fetch('Unit.json').then(r => r.json()),
    fetch('GPX-CS.json').then(r => r.json()),
    fetch('GPX-CSII.json').then(r => r.json()),
    fetch('GPX-CL.json').then(r => r.json()),
    fetch('GPX-CII.json').then(r => r.json()),
    fetch('NXT II.json').then(r => r.json())

])

.then(([

    aimex3,
    nxtr,
    nxt3,
    gpx,
    flexa,
    fujitrax,
    feeder,
    nexim,
    unit,
    gpxcs,
    gpxcs2,
    gpxcl,
    gpxc2,
    nxt2

]) => {

    quickFilters = {

        AIMEXIII : aimex3,
        NXTR : nxtr,
        NXTIII : nxt3,
        GPX : gpx,
        Flexa : flexa,
        Fujitrax : fujitrax,
        Feeder : feeder,
        Nexim : nexim,
        Unit : unit,
        "GPX-CS" : gpxcs,
        "GPX-CSII" : gpxcs2,
        "GPX-CL" : gpxcl,
        "GPX-CII" : gpxc2,
        "NXT II" : nxt2

    };

})

.catch(error => {

    console.error(
        'Quick Filter Load Error:',
        error
    );

});

/* =========================
   GLOBAL DATA
========================= */

let allData = [];

let categoryData = [];

let typeData = [];

let currentData = [];

let selectedCategory = '';

let selectedType = '';

/* PAGINATION */

let currentPage = 1;

const rowsPerPage = 50;

/* =========================
   CACHE DOM
========================= */

const pdfBody =
    document.getElementById('pdfBody');

const searchTitle =
    document.getElementById('searchTitle');

const pageInfo =
    document.getElementById('pageInfo');

/* =========================
   LOAD JSON
========================= */

fetch('data.json')

.then(response => response.json())

.then(data => {

    allData = data;

    categoryData = data;

    typeData = data;

    currentData = data;

    renderTable(allData);

})

.catch(error => {

    console.error(
        'JSON Load Error:',
        error
    );

});

/* =========================
   APPLY FILTERS
========================= */

function applyFilters(){

    let filtered = allData;

    /* CATEGORY FILTER */

    if(selectedCategory !== ''){

        filtered =
            filtered.filter(item =>

                String(item["Category"] || '')
                .toLowerCase()
                .includes(
                    selectedCategory.toLowerCase()
                )

            );

    }

    /* TYPE FILTER */

    if(selectedType !== ''){

        const targetTypes =
            quickFilters[selectedType] || [];

        filtered =
            filtered.filter(item =>

                targetTypes.includes(
                    String(item["TYPE"] || '').trim()
                )

            );

    }

    currentData = filtered;

    currentPage = 1;

    filterData();

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    return String(text)

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

/* =========================
   RENDER TABLE
========================= */

function renderTable(data){

    pdfBody.innerHTML = '';

    const fragment =
        document.createDocumentFragment();

    /* PAGINATION */

    const start =
        (currentPage - 1) * rowsPerPage;

    const end =
        start + rowsPerPage;

    const pageData =
        data.slice(start, end);

    /* BUILD ROWS */

    for(let i = 0; i < pageData.length; i++){

        const item = pageData[i];

        const title =
            escapeHTML(item["Title"] || '');

        const category =
            escapeHTML(item["Category"] || '');

        const type =
            escapeHTML(item["TYPE"] || '');

        const releaseDate =
            escapeHTML(item["Release date"] || '');

        const link =
            item["LINK"] || '#';

        const row =
            document.createElement('tr');

        row.innerHTML = `

            <td title="${title}">
                ${title}
            </td>

            <td title="${category}">
                ${category}
            </td>

            <td title="${type}">
                ${type}
            </td>

            <td>
                ${releaseDate}
            </td>

            <td>

                <a
                    class="action-btn"
                    href="${link}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    Open

                </a>

            </td>

        `;

        fragment.appendChild(row);

    }

    pdfBody.appendChild(fragment);

    updatePaginationInfo(data.length);

}

/* =========================
   PAGINATION
========================= */

function updatePaginationInfo(totalRows){

    const totalPages =
        Math.ceil(totalRows / rowsPerPage);

    pageInfo.innerText =
        `Page ${currentPage} / ${totalPages || 1}`;

}

function nextPage(){

    const totalPages =
        Math.ceil(currentData.length / rowsPerPage);

    if(currentPage < totalPages){

        currentPage++;

        filterData();

    }

}

function prevPage(){

    if(currentPage > 1){

        currentPage--;

        filterData();

    }

}

/* =========================
   FILTER
========================= */

function filterData(){

    const keyword =
        searchTitle.value
        .trim()
        .toLowerCase();

    let filtered = currentData;

    /* SEARCH TITLE */

    if(keyword !== ''){

        filtered =
            currentData.filter(item =>

                String(item["Title"] || '')
                .toLowerCase()
                .includes(keyword)

            );

    }

    renderTable(filtered);

}

/* =========================
   DEBOUNCE SEARCH
========================= */

let debounceTimer;

searchTitle.addEventListener('input', () => {

    clearTimeout(debounceTimer);

    debounceTimer = setTimeout(() => {

        currentPage = 1;

        filterData();

    }, 300);

});

/* =========================
   CATEGORY FILTER
========================= */

function setCategoryFilter(value){

    selectedCategory = value;

    applyFilters();

}

/* =========================
   QUICK FILTER
========================= */

function applyQuickFilter(filterName){

    selectedType = filterName;

    applyFilters();

}

/* =========================
   CLEAR FILTER
========================= */

function clearFilter(){

    searchTitle.value = '';

    selectedCategory = '';

    selectedType = '';

    currentData = allData;

    currentPage = 1;

    renderTable(allData);

}

</script>
