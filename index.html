<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Document Management</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

/* TITLE */

h1{
    text-align:center;
    margin-top:10px;
}

/* TOOLBAR */

.top-toolbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:#f4f4f4;
    padding-bottom:15px;
}

/* SEARCH */

.search-box{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search-box input{
    flex:1;
    min-width:220px;
    padding:12px;
    font-size:16px;
    border-radius:6px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

/* BUTTONS */

.quick-filter{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.quick-filter button{
    background:#28a745;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
}

.quick-filter button:hover{
    background:#1f7a33;
}

/* TABLE */

.table-wrapper{
    overflow:auto;
    width:100%;
    max-height:80vh;
    position:relative;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    table-layout:fixed;
}

/* STICKY HEADER */

thead th{
    position:sticky;
    top:0;
    z-index:999;
    background:#0078d4;
}

/* HEADER */

th{
    color:white;
    padding:12px;
    text-align:left;
    border:1px solid #ccc;

    resize:horizontal;
    overflow:auto;
    min-width:180px;
}

/* CELL */

td{
    border:1px solid #ccc;
    padding:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* ROW */

tr:hover{
    background:#f1f1f1;
}

/* OPEN LINK */

.action-btn{
    background:#0078d4;
    color:white;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;

    display:inline-block;
    text-decoration:none;
}

.action-btn:hover{
    background:#005ea2;
}

/* MOBILE */

@media(max-width:768px){

    .search-box{
        flex-direction:column;
    }

    table{
        font-size:12px;
    }

    th, td{
        padding:8px;
    }

}

</style>

</head>

<body>

<!-- TOOLBAR -->

<div class="top-toolbar">

    <h1>Document Management</h1>

    <!-- SEARCH -->

    <div class="search-box">

        <!-- TITLE -->

        <input
            type="text"
            id="searchTitle"
            placeholder="Search Title..."
        >

        <!-- CATEGORY -->

        <input
            list="categoryList"
            type="text"
            id="searchCategory"
            placeholder="Search Category..."
        >

        <datalist id="categoryList">

            <option value="C-1.Upgrade Reports">
            <option value="C-2.Version History">
            <option value="F-2.Specifications">
            <option value="A-1.Tech Reports">
            <option value="C-3.Software Notice">
            <option value="TRAINING TEXT">
            <option value="E-7.Field Engineer's Documents">
            <option value="A-2.Rep News">
            <option value="D-1.Manuals">
            <option value="E-6.Troubleshooting">
            <option value="E-4.Electrical Schematics">
            <option value="E-1.Parts List">
            <option value="D-2.Operation Manuals">
            <option value="A-5.FSF, SECS/GEM Technical Materials">

        </datalist>

        <!-- TYPE -->

        <input
            type="text"
            id="searchType"
            placeholder="Search Type..."
        >

    </div>

    <!-- CATEGORY BUTTONS -->

    <div class="quick-filter">

        <button onclick="setCategoryFilter('C-1.Upgrade Reports')">
            Upgrade Reports
        </button>

        <button onclick="setCategoryFilter('C-2.Version History')">
            Version History
        </button>

        <button onclick="setCategoryFilter('F-2.Specifications')">
            Specifications
        </button>

        <button onclick="setCategoryFilter('A-1.Tech Reports')">
            Tech Reports
        </button>

        <button onclick="setCategoryFilter('C-3.Software Notice')">
            Software Notice
        </button>

        <button onclick="setCategoryFilter('TRAINING TEXT')">
            Training
        </button>

        <button onclick="setCategoryFilter('E-7.Field Engineer\'s Documents')">
            FE Documents
        </button>

        <button onclick="setCategoryFilter('A-2.Rep News')">
            Rep News
        </button>

        <button onclick="setCategoryFilter('D-1.Manuals')">
            Manuals
        </button>

        <button onclick="setCategoryFilter('E-6.Troubleshooting')">
            Troubleshooting
        </button>

        <button onclick="setCategoryFilter('E-4.Electrical Schematics')">
            Electrical Schematics
        </button>

        <button onclick="setCategoryFilter('E-1.Parts List')">
            Parts List
        </button>

        <button onclick="setCategoryFilter('D-2.Operation Manuals')">
            Operation Manuals
        </button>

        <button onclick="setCategoryFilter('A-5.FSF, SECS/GEM Technical Materials')">
            FSF / SECS-GEM
        </button>

        <!-- NXTIII -->

        <button onclick="filterNXTIII()">

            NXTIII

        </button>

        <!-- CLEAR -->

        <button
            onclick="clearFilter()"
            style="background:#dc3545;"
        >

            CLEAR

        </button>

    </div>

</div>

<br>

<!-- TABLE -->

<div class="table-wrapper">

    <table id="pdfTable">

        <thead>

            <tr>

                <th>TITLE</th>

                <th>CATEGORY</th>

                <th>TYPE</th>

                <th>RELEASE DATE</th>

                <th>ACTION</th>

            </tr>

        </thead>

        <tbody id="pdfBody"></tbody>

    </table>

</div>

<script>

let allData = [];

/* LOAD JSON */

fetch('data.json')

.then(response => response.json())

.then(data => {

    allData = data;

    renderTable(data);

});

/* RENDER TABLE */

function renderTable(data){

    const body =
        document.getElementById('pdfBody');

    body.innerHTML = '';

    data.forEach(item => {

console.log(
        '[' + item["Category"] + ']'
    );

        const row =
            document.createElement('tr');

        row.innerHTML = `

            <td title="${item["Title"]}">
                ${item["Title"]}
            </td>

            <td title="${item["Category"]}">
                ${item["Category"]}
            </td>

            <td title="${item["TYPE"]}">
                ${item["TYPE"]}
            </td>

            <td>
                ${item["Release date"]}
            </td>

            <td>

                <a
                    class="action-btn"
                    href="${item["LINK"]}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    Open

                </a>

            </td>

        `;

        body.appendChild(row);

    });

}

/* SEARCH EVENTS */

document.getElementById('searchTitle')
.addEventListener('keyup', filterData);

document.getElementById('searchCategory')
.addEventListener('keyup', filterData);

document.getElementById('searchType')
.addEventListener('keyup', filterData);

/* FILTER */

function filterData(){

    const titleKeyword =
        document.getElementById(
            'searchTitle'
        )
        .value
        .toLowerCase();

    const categoryKeyword =
        document.getElementById(
            'searchCategory'
        )
        .value
        .toLowerCase();

    const typeKeyword =
        document.getElementById(
            'searchType'
        )
        .value
        .toLowerCase();

    const filtered = allData.filter(item =>

        String(item["Title"] || '')
	.toLowerCase()
	.includes(titleKeyword)

        &&

	String(item["Category"] || '')
	.toLowerCase()
	.includes(categoryKeyword)

        &&

	String(item["TYPE"] || '')
	.toLowerCase()
	.includes(typeKeyword)

    );

    renderTable(filtered);

}

/* CATEGORY BUTTON */

function setCategoryFilter(value){

    document.getElementById(
        'searchCategory'
    ).value = value;

    filterData();

}

/* NXTIII FILTER */

function filterNXTIII(){

    const targetTypes = [

        "AIMEX III",
        "AIMEX IIIc",
        "NXT III",
        "NXT IIIc",
        "NXT-H"

    ];

    const filtered = allData.filter(item =>

        targetTypes.includes(
            item["TYPE"]
        )

    );

    renderTable(filtered);

}

/* CLEAR */

function clearFilter(){

    /* CLEAR INPUT */

    document.getElementById(
        'searchTitle'
    ).value = '';

    document.getElementById(
        'searchCategory'
    ).value = '';

    document.getElementById(
        'searchType'
    ).value = '';

    /* SHOW ALL DATA */

    const body =
        document.getElementById('pdfBody');

    body.innerHTML = '';

    renderTable(allData);

}
</script>

</body>

</html>
