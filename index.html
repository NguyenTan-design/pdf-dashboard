<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PDF Dashboard</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

/* TITLE */

h1{
    text-align:center;
    margin-top:10px;
}

/* STICKY TOOLBAR */

.top-toolbar{
    position:sticky;
    top:0;
    z-index:999;
    background:#f4f4f4;
    padding:15px;
    border-bottom:2px solid #ddd;
}

/* SEARCH */

.search-box{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search-box input{
    flex:1;
    min-width:220px;
    padding:12px;
    font-size:16px;
    border-radius:6px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

/* QUICK FILTER */

.quick-filter{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.quick-filter button{
    background:#28a745;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
}

.quick-filter button:hover{
    background:#1f7a33;
}

/* TABLE */

.table-wrapper{
    overflow:auto;
    width:100%;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    table-layout:fixed;
}

th{
    background:#0078d4;
    color:white;
    padding:12px;
    text-align:left;
    border:1px solid #ccc;
}

td{
    border:1px solid #ccc;
    padding:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

tr:hover{
    background:#f1f1f1;
}

/* BUTTON */

.action-btn{
    background:#0078d4;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

.action-btn:hover{
    background:#005ea2;
}

/* MOBILE */

@media(max-width:768px){

    .search-box{
        flex-direction:column;
    }

    table{
        font-size:12px;
    }

    th, td{
        padding:8px;
    }

}

</style>

</head>

<body>

<h1>PDF Dashboard</h1>

<!-- TOOLBAR -->

<div class="top-toolbar">

    <!-- SEARCH -->

    <div class="search-box">

        <!-- TITLE -->

        <input
            type="text"
            id="searchTitle"
            placeholder="Search Title..."
        >

        <!-- CATEGORY -->

        <input
            type="text"
            id="searchCategory"
            placeholder="Search Category..."
        >

        <!-- TYPE -->

        <input
            type="text"
            id="searchType"
            placeholder="Search Type..."
        >

    </div>

    <!-- QUICK FILTER BUTTON -->

    <div class="quick-filter"
         id="quickFilterContainer">

    </div>

</div>

<br>

<!-- TABLE -->

<div class="table-wrapper">

    <table id="pdfTable">

        <thead>

            <tr>

                <th>TITLE</th>

                <th>CATEGORY</th>

                <th>TYPE</th>

                <th>RELEASE DATE</th>

                <th>ACTION</th>

            </tr>

        </thead>

        <tbody id="pdfBody"></tbody>

    </table>

</div>

<script>

let allData = [];

let quickFilters = [];

/* LOAD DATA */

Promise.all([

    fetch('data.json')
    .then(res => res.json()),

    fetch('quickFilters.json')
    .then(res => res.json())

])

.then(([data, filters]) => {

    allData = data;

    quickFilters = filters;

    renderTable(data);

    generateQuickButtons();

});

/* TABLE */

function renderTable(data){

    const body =
        document.getElementById('pdfBody');

    body.innerHTML = '';

    data.forEach(item => {

        const row =
            document.createElement('tr');

        row.innerHTML = `

            <td title="${item["Title"]}">
                ${item["Title"]}
            </td>

            <td title="${item["Category"]}">
                ${item["Category"]}
            </td>

            <td title="${item["TYPE"]}">
                ${item["TYPE"]}
            </td>

            <td>
                ${item["Release date"]}
            </td>

            <td>

                <button
                    class="action-btn"
                    onclick="openPDF('${item["LINK"]}')"
                >

                    Open

                </button>

            </td>

        `;

        body.appendChild(row);

    });

}

/* SEARCH EVENT */

document.getElementById('searchTitle')
.addEventListener('keyup', filterData);

document.getElementById('searchCategory')
.addEventListener('keyup', filterData);

document.getElementById('searchType')
.addEventListener('keyup', filterData);

/* NORMAL FILTER */

function filterData(){

    const titleKeyword =
        document.getElementById(
            'searchTitle'
        )
        .value
        .toLowerCase();

    const categoryKeyword =
        document.getElementById(
            'searchCategory'
        )
        .value
        .toLowerCase();

    const typeKeyword =
        document.getElementById(
            'searchType'
        )
        .value
        .toLowerCase();

    const filtered = allData.filter(item =>

        item["Title"]
        .toLowerCase()
        .includes(titleKeyword)

        &&

        item["Category"]
        .toLowerCase()
        .includes(categoryKeyword)

        &&

        item["TYPE"]
        .toLowerCase()
        .includes(typeKeyword)

    );

    renderTable(filtered);

}

/* QUICK FILTER ENGINE */

function quickFilter(filters){

    const filtered = allData.filter(item => {

        /* TYPE */

        if(filters.TYPE){

            if(
                !filters.TYPE.includes(
                    item["TYPE"]
                )
            ){
                return false;
            }

        }

        /* CATEGORY */

        if(filters.Category){

            if(
                !filters.Category.includes(
                    item["Category"]
                )
            ){
                return false;
            }

        }

        return true;

    });

    renderTable(filtered);

}

/* GENERATE BUTTON */

function generateQuickButtons(){

    const container =
        document.getElementById(
            'quickFilterContainer'
        );

    quickFilters.forEach(filter => {

        const btn =
            document.createElement('button');

        btn.innerText = filter.name;

        btn.onclick = function(){

            quickFilter(filter);

        };

        container.appendChild(btn);

    });

    /* CLEAR BUTTON */

    const clearBtn =
        document.createElement('button');

    clearBtn.innerText = 'CLEAR';

    clearBtn.style.background = '#dc3545';

    clearBtn.onclick = clearFilter;

    container.appendChild(clearBtn);

}

/* CLEAR */

function clearFilter(){

    document.getElementById(
        'searchTitle'
    ).value = '';

    document.getElementById(
        'searchCategory'
    ).value = '';

    document.getElementById(
        'searchType'
    ).value = '';

    renderTable(allData);

}

/* OPEN PDF */

function openPDF(link){

    window.location.href = link;

}

</script>

</body>

</html>
