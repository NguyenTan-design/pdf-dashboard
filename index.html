<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<link rel="icon" type="image/png" href="favicon.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NA TEAM Document Management</title>

<style>

/* =========================================================
   ROOT / DESIGN TOKENS
   ========================================================= */
:root{
  --primary:#0078d4;
  --primary-dark:#005ea2;
  --primary-light:#e8f4fd;
  --success:#10b981;
  --success-dark:#059669;
  --danger:#ef4444;
  --danger-dark:#dc2626;
  --warning:#f59e0b;
  --warning-dark:#d97706;
  --purple:#7c3aed;
  --purple-dark:#6d28d9;
  --gray-50:#f9fafb;
  --gray-100:#f3f4f6;
  --gray-200:#e5e7eb;
  --gray-300:#d1d5db;
  --gray-400:#9ca3af;
  --gray-500:#6b7280;
  --gray-600:#4b5563;
  --gray-700:#374151;
  --gray-800:#1f2937;
  --gray-900:#111827;
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:14px;
  --radius-pill:999px;
  --shadow-sm:0 1px 3px rgba(15,23,42,0.06);
  --shadow:0 4px 12px rgba(15,23,42,0.08);
  --shadow-lg:0 10px 28px rgba(15,23,42,0.12);
  --shadow-xl:0 24px 48px rgba(15,23,42,0.18);
  --transition:all .2s cubic-bezier(.4,0,.2,1);
}

/* =========================================================
   GLOBAL
   ========================================================= */
*{box-sizing:border-box;}

body{
  margin:0;padding:12px;
  background:linear-gradient(180deg,#eef2f8 0%,#e6ecf4 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--gray-800);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

h1{
  margin:0 0 14px;text-align:center;
  font-size:30px;font-weight:800;
  color:var(--primary-dark);
  letter-spacing:-.5px;
}

/* =========================================================
   TOOLBAR
   ========================================================= */
.top-toolbar{
  position:sticky;top:0;z-index:9999;
  background:transparent;padding-bottom:12px;
}

/* HEADER TOP (user info + logout) */
.header-top{
  display:flex;justify-content:flex-end;align-items:center;
  gap:12px;margin-bottom:8px;
  padding:6px 14px;background:white;
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
  border:1px solid var(--gray-200);
}

.user-info{font-size:13px;color:var(--gray-600);}
.user-info strong{color:var(--primary);font-weight:700;}

/* SEARCH */
.search-box{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;}

.search-box input{
  flex:1;min-width:220px;
  padding:11px 16px;border-radius:var(--radius);
  border:1.5px solid var(--gray-200);font-size:14px;
  background:white;transition:var(--transition);
  box-shadow:var(--shadow-sm);
}

.search-box input:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(0,120,212,.12);
}

/* BUTTONS */
.quick-filter{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:8px 10px;background:white;
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  border:1px solid var(--gray-200);
}

.quick-filter button{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;border:none;
  padding:7px 13px;border-radius:var(--radius-pill);
  cursor:pointer;font-size:12px;font-weight:600;
  transition:var(--transition);
  box-shadow:0 2px 4px rgba(22,163,74,.22);
  letter-spacing:.2px;
}

.quick-filter button:hover{
  transform:translateY(-1px);
  background:linear-gradient(135deg,#16a34a,#15803d);
  box-shadow:0 4px 8px rgba(22,163,74,.32);
}

.quick-filter button.black-btn{
  background:linear-gradient(135deg,#374151,#1f2937) !important;
  box-shadow:0 2px 4px rgba(31,41,55,.28) !important;
}
.quick-filter button.black-btn:hover{
  background:linear-gradient(135deg,#1f2937,#0f172a) !important;
  box-shadow:0 4px 8px rgba(31,41,55,.38) !important;
}

.quick-filter button.knowledge-btn{
  background:linear-gradient(135deg,#a855f7,#7c3aed) !important;
  color:#fff;
  box-shadow:0 2px 4px rgba(124,58,237,.28) !important;
}
.quick-filter button.knowledge-btn:hover{
  background:linear-gradient(135deg,#9333ea,#6d28d9) !important;
}

.clear-btn{
  background:linear-gradient(135deg,#ef4444,#dc2626) !important;
  box-shadow:0 2px 4px rgba(220,38,38,.28) !important;
}
.clear-btn:hover{
  background:linear-gradient(135deg,#dc2626,#b91c1c) !important;
}

.logout-btn{
  background:linear-gradient(135deg,#64748b,#475569) !important;
  color:white;border:none;
  padding:7px 16px;border-radius:var(--radius-pill);
  cursor:pointer;font-size:12px;font-weight:700;
  transition:var(--transition);
  letter-spacing:.5px;
  box-shadow:0 2px 4px rgba(71,85,105,.28);
}
.logout-btn:hover{
  background:linear-gradient(135deg,#475569,#334155) !important;
  transform:translateY(-1px);
}

.note-filter-btn{
  background:linear-gradient(135deg,#fbbf24,#f59e0b) !important;
  color:#78350f !important;
  box-shadow:0 2px 4px rgba(245,158,11,.32) !important;
}
.note-filter-btn:hover{
  background:linear-gradient(135deg,#f59e0b,#d97706) !important;
}
.note-filter-btn.active{
  background:linear-gradient(135deg,#d97706,#b45309) !important;
  color:#fff !important;
  box-shadow:0 0 0 3px rgba(245,158,11,.4) !important;
}

/* =========================================================
   TABLE WRAPPER
   ========================================================= */
.table-wrapper{
  width:100%;overflow:auto;
  height:calc(100vh - 288px);
  border-radius:var(--radius-lg);
  background:white;
  box-shadow:var(--shadow-lg);
  border:1px solid var(--gray-200);
}

/* =========================================================
   TABLE
   ========================================================= */
table{width:100%;border-collapse:collapse;table-layout:fixed;background:white;}

thead th{
  position:sticky;top:0;z-index:999;
  background:linear-gradient(180deg,#0078d4 0%,#006bbf 100%);
  color:#fff;font-weight:600;letter-spacing:.3px;
}

th{
  color:white;text-align:left;padding:13px 12px;font-size:13px;
  border:1px solid rgba(255,255,255,.12);
  resize:horizontal;overflow:auto;
}

td{
  padding:12px;vertical-align:top;font-size:13px;
  border:1px solid var(--gray-200);color:var(--gray-700);
}

tbody tr:nth-child(even){background:var(--gray-50);}
tbody tr{transition:background .15s ease;}
tbody tr:hover{background:var(--primary-light);}

/* COLUMN WIDTHS */
th:nth-child(1),td:nth-child(1){width:22%;}
td:nth-child(1){
  white-space:normal;word-break:break-word;
  line-height:1.6;font-weight:500;color:var(--gray-800);
}

th:nth-child(2),td:nth-child(2){width:18%;}
td:nth-child(2){
  white-space:normal;word-break:break-word;overflow-wrap:anywhere;
  line-height:1.5;font-weight:700;color:var(--danger);
}

th:nth-child(3),td:nth-child(3){width:9%;}
td:nth-child(3){white-space:normal;word-break:break-word;line-height:1.5;}

th:nth-child(4),td:nth-child(4){width:8%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

th:nth-child(5),td:nth-child(5){width:8%;white-space:nowrap;}

th:nth-child(6),td:nth-child(6){width:6%;white-space:nowrap;text-align:center;}

th:nth-child(7),td:nth-child(7){width:5%;text-align:center;white-space:nowrap;}

th:nth-child(8),td:nth-child(8),
th:nth-child(9),td:nth-child(9),
th:nth-child(10),td:nth-child(10){width:8%;white-space:nowrap;text-align:center;}

/* LOGIC HIỂN THỊ LINK1/2/3 — giữ nguyên */
table.user-view .col-link1,
table.user-view .col-link2,
table.user-view .col-link3{
  display:none !important;
}

table.user-view th:nth-child(6),table.user-view td:nth-child(6){width:10%;}
table.user-view th:nth-child(7),table.user-view td:nth-child(7){width:8%;}

/* =========================================================
   OPEN BUTTON
   ========================================================= */
.action-btn{
  display:inline-block;
  background:linear-gradient(135deg,#0078d4,#005ea2);
  color:white;text-decoration:none;
  padding:8px 14px;border-radius:var(--radius-sm);
  font-weight:600;font-size:12px;
  transition:var(--transition);
  box-shadow:0 2px 6px rgba(0,120,212,.28);
  letter-spacing:.3px;
  border:none;cursor:pointer;
}

.action-btn:hover{
  background:linear-gradient(135deg,#006bbf,#004a80);
  transform:translateY(-1px);
  box-shadow:0 4px 10px rgba(0,120,212,.38);
}

.action-btn:disabled{
  opacity:.5;cursor:not-allowed;
  transform:none !important;box-shadow:none !important;
}

/* =========================================================
   MASTER BUTTONS
   ========================================================= */
.master-btn{
  background:none;border:none;cursor:pointer;font-size:16px;
  padding:2px 4px;border-radius:4px;transition:var(--transition);
}
.master-btn:hover{background:var(--gray-100);}

/* ROW ACTION BUTTONS (✏️ 🗑️) */
.row-actions{
  display:flex;flex-direction:row;align-items:center;
  gap:6px;margin-top:6px;
}

.row-action-btn{
  width:22px;height:22px;border:none;border-radius:var(--radius-sm);
  background:transparent;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:.35;padding:0;flex-shrink:0;
  transition:opacity .15s ease, background .15s ease;
}

.row-action-btn:hover,
.row-action-btn:focus-visible{opacity:1;background:rgba(0,0,0,.06);}

.row-action-btn.delete-btn:hover,
.row-action-btn.delete-btn:focus-visible{background:rgba(239,68,68,.14);}

/* HOLD INDICATOR */
.hold-indicator{
  position:fixed;z-index:99998;display:none;pointer-events:none;
  background:linear-gradient(135deg,#1f2937,#111827);
  color:#fff;font-size:12px;
  padding:8px 12px 10px;border-radius:var(--radius);
  box-shadow:0 8px 20px rgba(0,0,0,.35);min-width:150px;
}

.hold-indicator.show{display:block;}

.hold-indicator .hold-bar{
  margin-top:6px;height:4px;border-radius:2px;
  background:rgba(255,255,255,.2);overflow:hidden;
}

.hold-indicator .hold-bar > span{
  display:block;height:100%;width:0;background:#60a5fa;border-radius:2px;
}

.hold-indicator.show .hold-bar > span{
  animation:holdFill var(--hold-ms,5000ms) linear forwards;
}

@keyframes holdFill{from{width:0;}to{width:100%;}}

/* TITLE CELL */
.title-text{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;cursor:pointer;transition:color .15s ease;
}
.title-text:hover{color:var(--primary);}

/* SELECT RECORD */
tbody tr.selected,
tbody tr.selected:hover,
tbody tr.selected:nth-child(even){background:#c9ced4 !important;}

body.pressing-row tbody tr{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}

#selectionBar{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  z-index:99990;display:none;align-items:center;gap:10px;
  background:linear-gradient(135deg,#1f2937,#111827);color:#fff;font-size:13px;
  padding:10px 12px 10px 16px;border-radius:var(--radius-pill);
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.08);
}
#selectionBar.show{display:flex;}
#selectionBar button{
  border:none;border-radius:var(--radius-pill);
  background:#6b7280;color:#fff;
  padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;
  transition:var(--transition);
}
#selectionBar button:hover{background:#4b5563;}

/* TITLE POPUP */
.title-popup-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(15,23,42,.5);
  display:flex;justify-content:center;align-items:center;
  z-index:9999999;
}
.title-popup-box{
  background:#fff;border-radius:var(--radius-lg);
  padding:18px 20px;width:88%;max-width:440px;
  max-height:70vh;overflow:auto;
  box-shadow:var(--shadow-xl);border:1px solid var(--gray-200);
}
.title-popup-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;font-size:12px;font-weight:700;
  color:var(--primary);letter-spacing:.5px;
  padding-bottom:8px;border-bottom:1px solid var(--gray-200);
}
.title-popup-close{
  border:none;background:none;cursor:pointer;font-size:16px;
  color:var(--gray-500);padding:4px 8px;border-radius:var(--radius-sm);
  transition:var(--transition);
}
.title-popup-close:hover{background:var(--gray-100);color:var(--danger);}
.title-popup-text{
  font-size:14px;line-height:1.6;color:var(--gray-800);
  white-space:pre-wrap;word-break:break-word;
}
.title-popup-docno{
  margin-top:12px;padding-top:12px;
  border-top:1px solid var(--gray-200);
  font-size:12px;font-weight:700;color:var(--danger);word-break:break-all;
}

/* CONFIRM LIST */
.confirm-list{
  max-height:140px;overflow:auto;text-align:left;
  border:1px solid #fecaca;border-radius:var(--radius);
  padding:8px 12px;margin-bottom:14px;
  font-size:12px;font-weight:700;color:var(--danger);
  word-break:break-all;background:#fef2f2;
}
.confirm-note{font-size:12px;color:var(--gray-500);margin:-6px 0 14px;}

/* LINK BUTTON */
.link-btn{
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  border:none;cursor:pointer;font-size:14px;
  padding:5px 10px;border-radius:var(--radius-sm);
  transition:var(--transition);
  box-shadow:0 2px 4px rgba(245,158,11,.28);
}
.link-btn:hover{
  background:linear-gradient(135deg,#f59e0b,#d97706);
  transform:translateY(-1px);
}

/* LINKED OPEN BUTTON */
.linked-open-btn{
  display:inline-block;
  background:linear-gradient(135deg,#06b6d4,#0891b2);
  color:white;text-decoration:none;
  padding:5px 10px;border-radius:var(--radius-sm);
  font-weight:700;font-size:11px;cursor:pointer;
  transition:var(--transition);user-select:none;
  box-shadow:0 2px 4px rgba(8,145,178,.28);
}
.linked-open-btn:hover{
  background:linear-gradient(135deg,#0891b2,#0e7490);
  transform:translateY(-1px);
}

/* CHECKBOX */
.note-checkbox{
  width:18px;height:18px;cursor:pointer;
  accent-color:var(--primary);
}
.note-checkbox:disabled{cursor:not-allowed;opacity:.6;}

/* =========================================================
   MODAL
   ========================================================= */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(15,23,42,.55);
  display:flex;justify-content:center;align-items:center;
  z-index:99999;
}

.modal-box{
  background:white;border-radius:var(--radius-lg);padding:20px;
  width:90%;max-width:1100px;max-height:85vh;overflow:auto;
  box-shadow:var(--shadow-xl);border:1px solid var(--gray-200);
  display:flex;flex-direction:column;
  transition:all .2s;
}

.modal-box.maximized{width:98vw;height:95vh;max-width:98vw;max-height:95vh;}

.modal-box.minimized{
  width:340px;height:auto;max-height:60px;overflow:hidden;align-self:flex-end;
}

.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;padding-bottom:12px;
  border-bottom:2px solid var(--primary);cursor:move;
}

.modal-header h3{margin:0;font-size:16px;color:var(--primary);font-weight:700;}

.modal-controls{display:flex;gap:6px;}

.modal-controls button{
  width:30px;height:30px;border:none;border-radius:var(--radius-sm);
  cursor:pointer;font-weight:700;font-size:14px;transition:var(--transition);
}

.btn-minimize{background:#fbbf24;color:#78350f;}
.btn-minimize:hover{background:#f59e0b;}

.btn-maximize{background:#06b6d4;color:white;}
.btn-maximize:hover{background:#0891b2;}

.btn-close-modal{background:#ef4444;color:white;}
.btn-close-modal:hover{background:#dc2626;}

.modal-search{display:flex;gap:8px;margin-bottom:12px;}

.modal-search input{
  flex:1;padding:10px 14px;border-radius:var(--radius-sm);
  border:1.5px solid var(--gray-200);font-size:13px;transition:var(--transition);
}

.modal-search input:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(0,120,212,.12);
}

.modal-table-wrap{
  flex:1;overflow:auto;border:1px solid var(--gray-200);border-radius:var(--radius);
}

.modal-table-wrap table{width:100%;border-collapse:collapse;}

.modal-table-wrap th{
  background:linear-gradient(180deg,#0078d4 0%,#006bbf 100%);
  color:white;padding:10px 8px;font-size:12px;
  position:sticky;top:0;font-weight:600;border:none;
}

.modal-table-wrap td{
  padding:10px 8px;font-size:12px;
  border-bottom:1px solid var(--gray-200);color:var(--gray-700);
}

.modal-table-wrap tr{cursor:pointer;transition:background .15s;}

.modal-table-wrap tr:hover{background:var(--primary-light);}

.modal-table-wrap tr.selected{background:#dcfce7;font-weight:700;}

.modal-actions{
  margin-top:14px;text-align:right;
  display:flex;justify-content:flex-end;gap:10px;
}

.modal-actions button{
  padding:10px 20px;border:none;border-radius:var(--radius-sm);
  cursor:pointer;font-weight:700;font-size:13px;transition:var(--transition);
}

.modal-actions .cancel-btn{
  background:linear-gradient(135deg,#ef4444,#dc2626);
  color:white;box-shadow:0 2px 6px rgba(220,38,38,.28);
}
.modal-actions .cancel-btn:hover{
  background:linear-gradient(135deg,#dc2626,#b91c1c);
}

/* =========================================================
   LOGIN OVERLAY
   ========================================================= */
.login-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(135deg,#0078d4 0%,#004578 100%);
  display:flex;justify-content:center;align-items:center;
  z-index:999999;overflow:hidden;
}

.login-overlay::before{
  content:'';position:absolute;
  width:420px;height:420px;border-radius:50%;
  background:rgba(255,255,255,.06);
  top:-140px;right:-140px;pointer-events:none;
}
.login-overlay::after{
  content:'';position:absolute;
  width:320px;height:320px;border-radius:50%;
  background:rgba(255,255,255,.04);
  bottom:-100px;left:-100px;pointer-events:none;
}

.login-box{
  background:white;border-radius:var(--radius-lg);
  padding:36px 32px;width:380px;max-width:90%;
  box-shadow:0 24px 64px rgba(0,0,0,.4);
  position:relative;z-index:1;
}

.login-box h2{
  margin:0 0 24px;text-align:center;
  color:var(--primary);font-size:22px;font-weight:800;
}

.login-box input{
  width:100%;padding:12px 14px;margin-bottom:14px;
  border-radius:var(--radius);border:1.5px solid var(--gray-200);
  font-size:14px;transition:var(--transition);
}

.login-box input:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(0,120,212,.12);
}

.login-box button{
  width:100%;padding:13px;border:none;border-radius:var(--radius);
  background:linear-gradient(135deg,#0078d4,#005ea2);
  color:white;font-size:15px;font-weight:700;
  cursor:pointer;transition:var(--transition);
  box-shadow:0 4px 14px rgba(0,120,212,.32);
  letter-spacing:.3px;
}

.login-box button:hover{
  background:linear-gradient(135deg,#006bbf,#004a80);
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(0,120,212,.42);
}

.login-error{
  color:var(--danger);font-size:13px;text-align:center;
  margin-bottom:10px;min-height:18px;
}

/* =========================================================
   CONFIRM OVERLAY
   ========================================================= */
.confirm-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(15,23,42,.6);
  display:flex;justify-content:center;align-items:center;
  z-index:999998;
}

.confirm-box{
  background:white;border-radius:var(--radius-lg);padding:24px;
  max-width:460px;width:90%;text-align:center;
  box-shadow:var(--shadow-xl);border:1px solid var(--gray-200);
}

.confirm-box h3{
  margin:0 0 12px;color:var(--danger);
  font-size:18px;font-weight:700;
}

.confirm-box p{
  margin:0 0 16px;color:var(--gray-700);
  font-size:14px;line-height:1.5;
}

.confirm-box .confirm-doc{
  font-weight:700;color:var(--danger);word-break:break-all;
}

.confirm-box input[type="password"]{
  width:100%;padding:12px 14px;border-radius:var(--radius);
  border:1.5px solid var(--gray-200);
  font-size:14px;margin-bottom:12px;transition:var(--transition);
}

.confirm-box input[type="password"]:focus{
  outline:none;border-color:var(--danger);
  box-shadow:0 0 0 4px rgba(239,68,68,.14);
}

.confirm-box .pwd-error{
  color:var(--danger);font-size:12px;
  min-height:16px;margin-bottom:8px;
}

.confirm-actions{display:flex;justify-content:center;gap:12px;}

.confirm-actions button{
  padding:10px 24px;border:none;border-radius:var(--radius);
  cursor:pointer;font-weight:700;font-size:14px;transition:var(--transition);
}

.confirm-actions .btn-cancel{
  background:linear-gradient(135deg,#64748b,#475569);

.wizard-overlay{

.wizard-box{

.wizard-box h3{

}

.wizard-box .step-label{
  text-align:center;color:var(--gray-500);

}

.wizard-box .step-content label{

}

.wizard-box .step-content input,
.wizard-box .step-content select{
  width:100%;padding:10px 14px;border-radius:var(--radius);
  border:1.5px solid var(--gray-200);font-size:14px;
  transition:var(--transition);
}

.wizard-box .step-content input:focus,
.wizard-box .step-content select:focus{
  outline:none;border-color:var(--primary);

.wizard-progress{

}

.wizard-progress .dot{

  border:2px solid var(--gray-200);
}

.wizard-progress .dot.active{

/* =========================

const ROWS_PER_PAGE = 50;

/* =========================

let quickFilters = {};

Promise.all([
fetch('AIMEXIII.json').then(r => r.json()),
fetch('NXTR.json').then(r => r.json()),
fetch('NXTIII.json').then(r => r.json()),
fetch('GPX.json').then(r => r.json()),
fetch('Flexa.json').then(r => r.json()),
fetch('Fujitrax.json').then(r => r.json()),
fetch('Feeder.json').then(r => r.json()),
fetch('Nexim.json').then(r => r.json()),
fetch('Unit.json').then(r => r.json()),
fetch('GPX-CS.json').then(r => r.json()),
fetch('GPX-CSII.json').then(r => r.json()),

Unit:unit, "GPX-CS":gpxcs, "GPX-CSII":gpxcs2,
"GPX-CL":gpxcl, "GPX-CII":gpxc2, "NXT II":nxt2,
KNOWLEDGE:knowledge
};
categoryList = Array.isArray(cats) ? cats : [];
})
.catch(error => console.error('Quick Filter Load Error:', error));

/* =========================
  GLOBAL DATA
========================= */

let allData = [];

/* =========================
  COUNTDOWN TOAST
========================= */

let countdownToastEl = null;
let countdownInterval = null;

function showCountdownToast(message, seconds, onDone){
  removeCountdownToast();

  countdownToastEl = document.createElement('div');
  countdownToastEl.className = 'countdown-toast';
  countdownToastEl.innerHTML =
    message + ' <span class="countdown-num">' + seconds + '</span>s';

  document.body.appendChild(countdownToastEl);

  let remaining = seconds;

  countdownInterval = setInterval(() => {
    remaining--;
    const numEl = countdownToastEl.querySelector('.countdown-num');
    if(numEl) numEl.textContent = remaining;

    if(remaining <= 0){
      clearInterval(countdownInterval);
      countdownInterval = null;
      removeCountdownToast();
      if(typeof onDone === 'function') onDone();
    }
  }, 1000);
}

function removeCountdownToast(){
  if(countdownToastEl){
    countdownToastEl.remove();
    countdownToastEl = null;
  }
  if(countdownInterval){
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
}

/* =========================
  LOGIN
========================= */

async function doLogin(){

const username = document.getElementById('loginUser').value.trim();
const password = document.getElementById('loginPass').value;
const errorEl = document.getElementById('loginError');
errorEl.textContent = '';

if(!username || !password){
errorEl.textContent = 'Vui lòng nhập đầy đủ thông tin.';
return;
}

try{
const res = await fetch(API_BASE + '/login', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ username, password })
});

const data = await res.json();

if(!res.ok || !data.success){
errorEl.textContent = data.message || 'Đăng nhập thất bại.';
return;
}

currentUser = { username: data.username, role: data.role };
userToken = data.token;

sessionStorage.setItem('dm_user', JSON.stringify(currentUser));
sessionStorage.setItem('dm_token', userToken);

logAction('LOGIN', 'User đăng nhập');

startApp();

}catch(err){
console.error(err);
errorEl.textContent = 'Lỗi kết nối server.';
}

}

function doLogout(){
logAction('LOGOUT', 'User đăng xuất');
sessionStorage.removeItem('dm_user');
sessionStorage.removeItem('dm_token');
currentUser = null;
userToken = null;
document.body.classList.remove('role-master');
clearSelection();
document.getElementById('mainApp').style.display = 'none';
document.getElementById('loginOverlay').style.display = 'flex';
document.getElementById('loginUser').value = '';
document.getElementById('loginPass').value = '';
}

  LOG ACTION
========================= */

async function logAction(action, detail){
try{
await fetch(API_BASE + '/log', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
username: currentUser ? currentUser.username : 'anonymous',
role: currentUser ? currentUser.role : 'guest',
action: action,
detail: detail || '',
timestamp: new Date().toISOString()
})
});
}catch(err){
console.warn('Log failed:', err);
}
}

/* =========================
  START APP
========================= */

async function startApp(){

document.getElementById('loginOverlay').style.display = 'none';
document.getElementById('mainApp').style.display = 'block';

userInfoEl.innerHTML =
'👤 <strong>' + currentUser.username + '</strong> (' + currentUser.role + ')';

if(currentUser.role === 'MASTER'){
  pdfTable.classList.remove('user-view');
  document.body.classList.add('role-master');
}else{
  pdfTable.classList.add('user-view');
  document.body.classList.remove('role-master');
}

const trainingBtn = document.querySelector('.training-btn');
if(trainingBtn){
  trainingBtn.style.display = (currentUser.role === 'MASTER') ? '' : 'none';
}

await loadData();
await loadLinkStore();

applyFilters();

}

/* =========================
  LOAD DATA
========================= */

async function loadData(){
try{
const res = await fetch('data.json', { cache: 'no-cache' });
allData = await res.json();
}catch(error){
console.error('JSON Load Error:', error);
}
}

/* =========================
  LOAD LINK STORE
========================= */

async function loadLinkStore(){

if(!currentUser) return;

try{
const res = await fetch(
API_BASE + '/links?username=' +
encodeURIComponent(currentUser.username)
);

if(res.ok){
const data = await res.json();
linkStore = data || {};
}else{
linkStore = {};
}

}catch(err){
console.warn('Load links failed:', err);
linkStore = {};
}

}

/* =========================
  ESCAPE
========================= */

function escapeHTML(text){
return String(text)
.replace(/&/g, '&amp;')
.replace(/</g, '&lt;')
.replace(/>/g, '&gt;')
.replace(/"/g, '&quot;')
.replace(/'/g, '&#039;');
}

function escapeAttr(text){
return escapeHTML(text);
}

/* =========================
  APPLY FILTERS
========================= */

function applyFilters(){

const keyword = searchTitle.value.trim().toLowerCase();
const documentKeyword = searchDocNo.value.trim().toLowerCase();

const isMaster = currentUser && currentUser.role === 'MASTER';

filteredData = allData.filter(item => {

if(!isMaster){
  const cat = String(item["Category"] || '').trim().toLowerCase();
  if(cat === 'training text') return false;

const docKey = String(item["Document No"] || '').trim();

const matchCategory =
selectedCategory === '' ||
String(item["Category"] || '').toLowerCase()
.includes(selectedCategory.toLowerCase());

let matchType = true;
if(selectedType !== ''){
const targetTypes = quickFilters[selectedType] || [];
matchType = targetTypes.includes(String(item["TYPE"] || '').trim());
}

const matchKeyword =
keyword === '' ||
String(item["Title"] || '').toLowerCase().includes(keyword);

const matchDocument =
documentKeyword === '' ||
String(item["Document No"] || '').toLowerCase().includes(documentKeyword);

let matchNote = true;
if(noteFilterActive){
  let noteState;
  if(Object.prototype.hasOwnProperty.call(pendingNotes, docKey)){
    noteState = pendingNotes[docKey];
  }else{
    const stored = linkStore[docKey] || {};
    noteState = stored.note === true;
  }
  matchNote = noteState === true;
}

return matchCategory && matchType && matchKeyword && matchDocument && matchNote;

});

currentPage = 1;
renderTable();

}

'onclick="handleEditButtonClick(event, \'' + escapeAttr(docKey) + '\')">✏️</button>' +

/* =========================
  SELECT RECORD (MASTER)
========================= */

const SELECT_HOLD_MS = 1500;
const SELECT_MOVE_TOLERANCE = 10;

let selectedKeys = new Set();
let selPressTimer = null;
let selPressRow = null;
let selPressStart = null;
let suppressNextClick = false;

const selectionBar = document.createElement('div');
selectionBar.id = 'selectionBar';
selectionBar.innerHTML =
  '<span id="selectionCount"></span>' +
  '<button type="button" onclick="clearSelection()">Bỏ chọn tất cả</button>';
document.body.appendChild(selectionBar);

function updateSelectionBar(){
  const n = selectedKeys.size;
  if(n > 0){
    document.getElementById('selectionCount').textContent = '☑ Đã chọn ' + n + ' record';
    selectionBar.classList.add('show');
  }else{
    selectionBar.classList.remove('show');
  }
}

function clearSelection(){
  selectedKeys.clear();
  if(pdfBody){
    pdfBody.querySelectorAll('tr.selected').forEach(tr => tr.classList.remove('selected'));
  }
  updateSelectionBar();
}

function isInteractiveTarget(t){
  return !!(t && t.closest &&
    t.closest('button, a, input, select, textarea, label, .linked-open-btn'));
}

function cancelSelPress(){
  if(selPressTimer){
    clearTimeout(selPressTimer);
    selPressTimer = null;
  }
  selPressRow = null;
  selPressStart = null;
  document.body.classList.remove('pressing-row');
}

pdfBody.addEventListener('pointerdown', (e) => {

  suppressNextClick = false;

  if(!currentUser || currentUser.role !== 'MASTER') return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  if(isInteractiveTarget(e.target)) return;

  const tr = e.target.closest('tr');
  if(!tr || !tr.dataset.dockey) return;

  if(tr.classList.contains('selected')) return;

  cancelSelPress();

  selPressRow = tr;
  selPressStart = { x: e.clientX, y: e.clientY };
  document.body.classList.add('pressing-row');

  selPressTimer = setTimeout(() => {
    const row = selPressRow;
    cancelSelPress();
    if(!row) return;

    selectedKeys.add(row.dataset.dockey);
    row.classList.add('selected');
    updateSelectionBar();

    suppressNextClick = true;

    if(navigator.vibrate){
      try{ navigator.vibrate(30); }catch(err){}
    }
  }, SELECT_HOLD_MS);
});

pdfBody.addEventListener('pointermove', (e) => {
  if(!selPressRow || !selPressStart) return;
  const dx = e.clientX - selPressStart.x;
  const dy = e.clientY - selPressStart.y;
  if(Math.hypot(dx, dy) > SELECT_MOVE_TOLERANCE) cancelSelPress();
});

['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
  pdfBody.addEventListener(evt, cancelSelPress);
});

pdfBody.addEventListener('contextmenu', (e) => {
  if(currentUser && currentUser.role === 'MASTER' && !isInteractiveTarget(e.target)){
    e.preventDefault();
  }
});

pdfBody.addEventListener('click', (e) => {

  if(suppressNextClick){
    suppressNextClick = false;
    return;
  }

  if(isInteractiveTarget(e.target)) return;

  const tr = e.target.closest('tr');
  if(!tr) return;

  if(tr.classList.contains('selected')){
    selectedKeys.delete(tr.dataset.dockey);
    tr.classList.remove('selected');
    updateSelectionBar();
    return;
  }

  const titleCell = e.target.closest('td.title-cell');
  if(titleCell){
    const textEl = titleCell.querySelector('.title-text');
    openTitlePopup(
      textEl ? textEl.textContent : titleCell.textContent,
      tr.dataset.dockey || ''
    );
  }
});

let deleteBusy = false;

function handleDeleteButtonClick(event, docKey){

function closeDeleteConfirm(){
  deleteTargetKeys = [];
  closeConfirm(1);
}

function proceedToDeletePassword(){
  closeConfirm(1);
  closeConfirm(2);

  const n = deleteTargetKeys.length;

  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.id = 'confirmOverlay2';
  overlay.style.zIndex = '999999';

  const box = document.createElement('div');
  box.className = 'confirm-box';
  box.innerHTML =
    '<p>Nhập password để xác nhận xóa ' +
    (n === 1
      ? 'record:<br><span class="confirm-doc">' + escapeHTML(deleteTargetKeys[0] || '') + '</span>'
      : '<b>' + n + ' records</b>:') +
    '</p>' +
    '<input type="password" id="deletePasswordInput" placeholder="Password" ' +
    'autocomplete="off" onkeydown="if(event.key===\'Enter\') confirmDeletePassword()">' +
    '<div class="pwd-error" id="pwdError"></div>' +
    '<div class="confirm-actions">' +
    '<button class="btn-delete" onclick="confirmDeletePassword()">Xác nhận</button>' +
    '<button class="btn-cancel" onclick="cancelDeletePassword()">Cancel</button>' +
    '</div>';

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  setTimeout(() => {
    const inp = document.getElementById('deletePasswordInput');
    if(inp) inp.focus();
  }, 50);
}

function cancelDeletePassword(){
  if(deleteBusy) return;
  deleteTargetKeys = [];
  closeConfirm(2);
}

function closeConfirm(level){
  const el = document.getElementById('confirmOverlay' + level);
  if(el) el.remove();
}

async function confirmDeletePassword(){

  if(deleteBusy) return;

  const input = document.getElementById('deletePasswordInput');
  const errEl = document.getElementById('pwdError');
  const docKeys = deleteTargetKeys.slice();

  if(!input || docKeys.length === 0) return;

  const pwd = input.value;
  if(!pwd){
    if(errEl) errEl.textContent = 'Vui lòng nhập password.';
    return;
  }

  deleteBusy = true;
  input.disabled = true;
  if(errEl){
    errEl.style.color = '#666';
    errEl.textContent = '⏳ Đang xóa & commit data.json...';
  }

  try{
    const res = await fetch(API_BASE + '/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: currentUser.username,
        role: currentUser.role,
        docKeys: docKeys,
        password: pwd
      })
    });

    let data = {};
    try{ data = await res.json(); }catch(e){}

    if(res.status === 401){
      input.disabled = false;
      input.value = '';
      input.focus();
      if(errEl){
        errEl.style.color = '';
        errEl.textContent = 'Sai password, vui lòng thử lại.';
      }
      deleteBusy = false;
      return;
    }

    if(!res.ok || !data.success){
      closeConfirm(2);
      deleteTargetKeys = [];
      deleteBusy = false;
      alert('❌ Xóa thất bại: ' + (data.message || 'Lỗi không xác định.'));
      return;
    }

    closeConfirm(2);
    deleteTargetKeys = [];
    deleteBusy = false;

    const removed = new Set(docKeys);

    allData = allData.filter(x =>
      !removed.has(String(x["Document No"] || '').trim())
    );

    docKeys.forEach(k => {
      delete linkStore[k];
      delete pendingNotes[k];
      selectedKeys.delete(k);
    });
    updateSelectionBar();

    const page = currentPage;
    applyFilters();
    const totalPages = Math.max(1, Math.ceil(filteredData.length / ROWS_PER_PAGE));
    currentPage = Math.min(page, totalPages);
    renderTable();

    const warns = [];
    if(data.notFound && data.notFound.length){
      warns.push('Không tìm thấy trong data.json (chưa bị xóa khỏi file): ' +
        data.notFound.join(', '));
    }
    if(data.kvError){
      warns.push('Đã xóa khỏi data.json nhưng lỗi khi xóa NOTE/LINK trong KV: ' + data.kvError);
    }
    if(warns.length) alert('⚠️ ' + warns.join('\n'));

  }catch(err){
    console.error(err);
    input.disabled = false;
    deleteBusy = false;
    if(errEl){
      errEl.style.color = '';
      errEl.textContent = 'Lỗi kết nối server khi xóa.';
    }
  }
}

/* =========================
  EDIT WIZARD 5 STEP
========================= */

const EDIT_HOLD_MS = 5000;
const holdIndicatorEl = document.getElementById('holdIndicator');
let holdTimer = null;
let holdDocKey = null;

function cancelHold(){
  if(holdTimer){
    clearTimeout(holdTimer);
    holdTimer = null;
  }
  holdDocKey = null;

  if(holdIndicatorEl) holdIndicatorEl.classList.remove('show');

  document.removeEventListener('pointerdown', onOutsidePointerDown, true);
}

function onOutsidePointerDown(event){
  if(event.target.closest('.edit-btn')) return;
  cancelHold();
}

function placeHoldIndicator(x, y){
  if(!holdIndicatorEl) return;

  const w = 190;
  const left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8));
  const top = Math.max(8, Math.min(y + 18, window.innerHeight - 60));

  holdIndicatorEl.style.left = left + 'px';
  holdIndicatorEl.style.top = top + 'px';
}

function handleEditButtonClick(event, docKey){
  event.preventDefault();
  event.stopPropagation();

  if(!currentUser || currentUser.role !== 'MASTER') return;

  cancelHold();

  holdDocKey = docKey;

  if(holdIndicatorEl){
    holdIndicatorEl.style.setProperty('--hold-ms', EDIT_HOLD_MS + 'ms');

    document.getElementById('holdText').textContent =
      'Đợi ' + Math.round(EDIT_HOLD_MS / 1000) + 's để sửa record...';

    const rect = event.currentTarget.getBoundingClientRect();
    placeHoldIndicator(rect.right, rect.top);

    holdIndicatorEl.classList.remove('show');
    void holdIndicatorEl.offsetWidth;
    holdIndicatorEl.classList.add('show');
  }

  document.addEventListener('pointerdown', onOutsidePointerDown, true);

  holdTimer = setTimeout(() => {
    holdTimer = null;
    const key = holdDocKey;
    cancelHold();
    if(key) openEditWizard(key);
  }, EDIT_HOLD_MS);
}

let wizardState = null;

function openEditWizard(docKey){

  const item = allData.find(x =>
    String(x["Document No"] || '').trim() === docKey
  );

  if(!item) return;

  wizardState = {
    docKey: docKey,
    item: item,
    step: 1,
    values: {
      title: item["Title"] || '',
      documentNo: item["Document No"] || '',
      category: item["Category"] || '',
      type: item["TYPE"] || '',
      date: item["Release date"] || ''
    }
  };

  renderWizard();

}

function renderWizard(){

  const old = document.getElementById('editWizardOverlay');
  if(old) old.remove();

  const overlay = document.createElement('div');
  overlay.className = 'wizard-overlay';
  overlay.id = 'editWizardOverlay';

  const box = document.createElement('div');
  box.className = 'wizard-box';

  const step = wizardState.step;
  const totalSteps = 5;

  let dotsHtml = '<div class="wizard-progress">';
  for(let i = 1; i <= totalSteps; i++){
    let cls = 'dot';
    if(i < step) cls += ' done';
    else if(i === step) cls += ' active';
    dotsHtml += '<div class="' + cls + '">' + i + '</div>';
  }
  dotsHtml += '</div>';

  let contentHtml = '';

  if(step === 1){
    contentHtml =
      '<div class="step-content">' +
      '<label>STEP 1: TITLE</label>' +
      '<input type="text" id="wizTitle" value="' +
      escapeAttr(wizardState.values.title) + '">' +
      '<div class="old-value">Giá trị cũ: ' +
      escapeHTML(wizardState.item["Title"] || '') + '</div>' +
      '</div>';
  }else if(step === 2){
    contentHtml =
      '<div class="step-content">' +
      '<label>STEP 2: DOCUMENT NO</label>' +
      '<input type="text" id="wizDocNo" value="' +
      escapeAttr(wizardState.values.documentNo) + '">' +
      '<div class="old-value">Giá trị cũ: ' +
      escapeHTML(wizardState.item["Document No"] || '') + '</div>' +
      '</div>';
  }else if(step === 3){
    let opts = '<option value="">-- Chọn Category --</option>';
    if(categoryList.length === 0){
      opts += '<option value="' + escapeAttr(wizardState.values.category) + '">' +
        escapeHTML(wizardState.values.category) + '</option>';
    }else{
      categoryList.forEach(c => {
        const val = typeof c === 'string' ? c : (c.name || c.value || '');
        const sel = (val === wizardState.values.category) ? ' selected' : '';
        opts += '<option value="' + escapeAttr(val) + '"' + sel + '>' +
          escapeHTML(val) + '</option>';
      });
    }
    contentHtml =
      '<div class="step-content">' +
      '<label>STEP 3: CATEGORY</label>' +
      '<select id="wizCategory">' + opts + '</select>' +
      '<div class="old-value">Giá trị cũ: ' +
      escapeHTML(wizardState.item["Category"] || '') + '</div>' +
      '</div>';
  }else if(step === 4){
    contentHtml =
      '<div class="step-content">' +
      '<label>STEP 4: TYPE</label>' +
      '<input type="text" id="wizType" value="' +
      escapeAttr(wizardState.values.type) + '">' +
      '<div class="old-value">Giá trị cũ: ' +
      escapeHTML(wizardState.item["TYPE"] || '') + '</div>' +
      '</div>';
  }else if(step === 5){
    contentHtml =
      '<div class="step-content">' +
      '<label>STEP 5: DATE</label>' +
      '<input type="date" id="wizDate" value="' +
      escapeAttr(wizardState.values.date) + '">' +
      '<div class="old-value">Giá trị cũ: ' +
      escapeHTML(wizardState.item["Release date"] || '') + '</div>' +
      '</div>';
  }

  let actionsHtml = '<div class="wizard-actions">';
  if(step > 1){
    actionsHtml +=
      '<button class="btn-back" onclick="wizardBack()">← Quay lại</button>';
  }else{
    actionsHtml += '<span></span>';
  }

  if(step < totalSteps){
    actionsHtml +=
      '<button class="btn-next" onclick="wizardNext()">Tiếp →</button>';
  }else{
    actionsHtml +=
      '<button class="btn-save" onclick="wizardSave()">💾 Lưu</button>';
  }

  actionsHtml += '</div>';

  box.innerHTML =
    '<h3>✏️ Chỉnh sửa Document</h3>' +
    '<div class="step-label">Document: <b>' +
    escapeHTML(wizardState.docKey) + '</b></div>' +
    dotsHtml +
    contentHtml +
    actionsHtml +
    '<div style="text-align:center;margin-top:14px;">' +
    '<button class="btn-cancel-wizard" ' +
    'style="padding:8px 20px;border:none;border-radius:8px;' +
    'cursor:pointer;font-weight:bold;" ' +
    'onclick="closeWizard()">Hủy bỏ</button>' +
    '</div>';

  overlay.appendChild(box);
  document.body.appendChild(overlay);

}

function collectWizardStep(){
  const step = wizardState.step;
  if(step === 1){
    const v = document.getElementById('wizTitle');
    if(v) wizardState.values.title = v.value;
  }else if(step === 2){
    const v = document.getElementById('wizDocNo');
    if(v) wizardState.values.documentNo = v.value;
  }else if(step === 3){
    const v = document.getElementById('wizCategory');
    if(v) wizardState.values.category = v.value;
  }else if(step === 4){
    const v = document.getElementById('wizType');
    if(v) wizardState.values.type = v.value;
  }else if(step === 5){
    const v = document.getElementById('wizDate');
    if(v) wizardState.values.date = v.value;
  }
}

function wizardNext(){
  collectWizardStep();
  if(wizardState.step < 5){
    wizardState.step++;
    renderWizard();
  }
}

function wizardBack(){
  collectWizardStep();
  if(wizardState.step > 1){
    wizardState.step--;
    renderWizard();
  }
}

function closeWizard(){
  const el = document.getElementById('editWizardOverlay');
  if(el) el.remove();
  wizardState = null;
}

let wizardSaving = false;

async function wizardSave(){

  if(wizardSaving) return;

  collectWizardStep();

  const item = wizardState.item;
  const oldKey = wizardState.docKey;
  const v = wizardState.values;
  const newKey = String(v.documentNo || '').trim();

  if(!newKey){
    alert('❌ Document No không được để trống.');
    return;
  }

  if(newKey !== oldKey){
    const dup = allData.some(x =>
      x !== item && String(x["Document No"] || '').trim() === newKey
    );
    if(dup){
      alert('❌ Document No "' + newKey + '" đã tồn tại.');
      return;
    }
  }

  wizardSaving = true;

  const saveBtn = document.querySelector('.wizard-actions .btn-save');
  const saveBtnText = saveBtn ? saveBtn.textContent : '';
  if(saveBtn){
    saveBtn.disabled = true;
    saveBtn.textContent = '⏳ Đang commit...';
  }

  try{
    const res = await fetch(API_BASE + '/edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: currentUser.username,
        role: currentUser.role,
        docKey: oldKey,
        newTitle: v.title,
        newDocNo: newKey,
        newCategory: v.category,
        newType: v.type,
        newDate: v.date
      })
    });

    let data = {};
    try{ data = await res.json(); }catch(e){}

    if(!res.ok || !data.success){
      alert('❌ Lưu thất bại: ' + (data.message || 'Lỗi không xác định.'));
      if(saveBtn){
        saveBtn.disabled = false;
        saveBtn.textContent = saveBtnText;
      }
      wizardSaving = false;
      return;
    }

    item["Title"] = v.title;
    item["Document No"] = newKey;
    item["Category"] = v.category;
    item["TYPE"] = v.type;
    item["Release date"] = v.date;

    if(newKey !== oldKey){
      if(Object.prototype.hasOwnProperty.call(linkStore, oldKey)){
        linkStore[newKey] = linkStore[oldKey];
        delete linkStore[oldKey];
      }
      if(Object.prototype.hasOwnProperty.call(pendingNotes, oldKey)){
        pendingNotes[newKey] = pendingNotes[oldKey];
        delete pendingNotes[oldKey];
      }
      if(selectedKeys.has(oldKey)){
        selectedKeys.delete(oldKey);
        selectedKeys.add(newKey);
      }
    }

    wizardSaving = false;
    closeWizard();

    const page = currentPage;
    applyFilters();
    const totalPages = Math.max(1, Math.ceil(filteredData.length / ROWS_PER_PAGE));
    currentPage = Math.min(page, totalPages);
    renderTable();

    if(data.kvError){
      alert('⚠️ Đã lưu vào data.json nhưng lỗi khi chuyển NOTE/LINK trong KV: ' + data.kvError);
    }

  }catch(err){
    console.error(err);
    alert('❌ Lỗi kết nối server khi lưu.');
    if(saveBtn){
      saveBtn.disabled = false;
      saveBtn.textContent = saveBtnText;
    }
    wizardSaving = false;
  }

}

/* =========================
  PAGINATION
========================= */

function renderPagination(){

pagination.innerHTML = '';

const totalPages = Math.ceil(filteredData.length / ROWS_PER_PAGE);
if(totalPages <= 1) return;

const prevBtn = document.createElement('button');
prevBtn.textContent = 'Prev';
prevBtn.disabled = currentPage === 1;
prevBtn.className = 'action-btn';
prevBtn.onclick = () => { currentPage--; renderTable(); };
pagination.appendChild(prevBtn);

const pageInfo = document.createElement('span');
pageInfo.innerHTML = `<strong>Page ${currentPage} / ${totalPages}</strong>`;
pagination.appendChild(pageInfo);

const nextBtn = document.createElement('button');
nextBtn.textContent = 'Next';
nextBtn.disabled = currentPage === totalPages;
nextBtn.className = 'action-btn';
nextBtn.onclick = () => { currentPage++; renderTable(); };
pagination.appendChild(nextBtn);

}

  SEARCH
========================= */

let debounceTimer;
searchTitle.addEventListener('input', () => {
clearTimeout(debounceTimer);
debounceTimer = setTimeout(applyFilters, 300);
});
searchDocNo.addEventListener('input', () => {
clearTimeout(debounceTimer);
debounceTimer = setTimeout(applyFilters, 300);
});

/* =========================
  CATEGORY / QUICK FILTER
========================= */

function setCategoryFilter(value){
selectedCategory = value;
applyFilters();
}

function applyQuickFilter(filterName){
selectedType = filterName;
applyFilters();
}

function clearFilter(){
searchTitle.value = '';
searchDocNo.value = '';
selectedCategory = '';
selectedType = '';
noteFilterActive = false;
noteFilterBtn.classList.remove('active');
currentPage = 1;
applyFilters();
}

if(tableWrapper){

if(savedUser && savedToken){

currentUser = JSON.parse(savedUser);
userToken = savedToken;
startApp();
}catch(e){ /* ignore */ }
}

});
