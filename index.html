<body>

<h1>PDF Dashboard</h1>

<!-- STICKY TOOLBAR -->
<div class="top-toolbar">

    <div class="search-box">

        <!-- TITLE -->
        <input
            type="text"
            id="searchTitle"
            placeholder="Search Title..."
        >

        <!-- CATEGORY -->
        <input
            list="categoryList"
            type="text"
            id="searchCategory"
            placeholder="Search Category..."
        >

        <datalist id="categoryList">

            <option value="C-1.Upgrade Reports">
            <option value="C-2.Version History">
            <option value="F-2.Specifications">
            <option value="A-1.Tech Reports">
            <option value="C-3.Software Notice">
            <option value="TRAINING TEXT">
            <option value="E-7.Field Engineer's Documents">
            <option value="A-2.Rep News">
            <option value="D-1.Manuals">
            <option value="E-6.Troubleshooting">
            <option value="E-4.Electrical Schematics">
            <option value="E-1.Parts List">
            <option value="D-2.Operation Manuals">
            <option value="A-5.FSF, SECS/GEM Technical Materials">

        </datalist>

        <!-- TYPE -->
        <input
            type="text"
            id="searchType"
            placeholder="Search Type..."
        >

    </div>

    <!-- AUTO BUTTONS -->
    <div class="quick-filter" id="categoryButtons"></div>

</div>

<br>

<!-- TABLE WRAPPER -->
<div class="table-wrapper">

    <table id="pdfTable">

        <thead>
            <tr>
                <th>TITLE</th>
                <th>CATEGORY</th>
                <th>TYPE</th>
                <th>RELEASE DATE</th>
                <th>ACTION</th>
            </tr>
        </thead>

        <tbody id="pdfBody"></tbody>

    </table>

</div>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    padding:20px;
    margin:0;
}

/* TITLE */

h1{
    text-align:center;
    margin-top:10px;
}

/* STICKY TOOLBAR */

.top-toolbar{
    position:sticky;
    top:0;
    z-index:999;
    background:#f4f4f4;
    padding:15px;
    border-bottom:2px solid #ddd;
}

/* SEARCH */

.search-box{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search-box input{
    flex:1;
    min-width:220px;
    padding:12px;
    font-size:16px;
    border-radius:6px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

/* BUTTONS */

.quick-filter{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.quick-filter button{
    background:#28a745;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
}

.quick-filter button:hover{
    background:#1f7a33;
}

/* TABLE */

.table-wrapper{
    overflow:auto;
    width:100%;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    table-layout:fixed;
}

/* HEADER */

th{
    background:#0078d4;
    color:white;
    padding:12px;
    text-align:left;
    border:1px solid #ccc;
    resize:horizontal;
    overflow:auto;
}

/* CELLS */

td{
    border:1px solid #ccc;
    padding:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* ROW HOVER */

tr:hover{
    background:#f1f1f1;
}

/* OPEN BUTTON */

.action-btn{
    background:#0078d4;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

.action-btn:hover{
    background:#005ea2;
}

/* MOBILE */

@media(max-width:768px){

    .search-box{
        flex-direction:column;
    }

    table{
        font-size:12px;
    }

    th, td{
        padding:8px;
    }

}

</style>

<script>

let allData = [];

fetch('data.json')
.then(response => response.json())
.then(data => {

    allData = data;

    renderTable(data);

    generateCategoryButtons();

});

function renderTable(data){

    const body = document.getElementById('pdfBody');

    body.innerHTML = '';

    data.forEach(item => {

        const row = document.createElement('tr');

        row.innerHTML = `

            <td title="${item["Title"]}">
                ${item["Title"]}
            </td>

            <td title="${item["Category"]}">
                ${item["Category"]}
            </td>

            <td title="${item["TYPE"]}">
                ${item["TYPE"]}
            </td>

            <td>
                ${item["Release date"]}
            </td>

            <td>
                <button
                    class="action-btn"
                    onclick="openPDF('${item["LINK"]}')"
                >
                    Open
                </button>
            </td>

        `;

        body.appendChild(row);

    });

}

/* EVENTS */

document.getElementById('searchTitle')
.addEventListener('keyup', filterData);

document.getElementById('searchCategory')
.addEventListener('keyup', filterData);

document.getElementById('searchType')
.addEventListener('keyup', filterData);

/* FILTER */

function filterData(){

    const titleKeyword =
        document.getElementById('searchTitle')
        .value
        .toLowerCase();

    const categoryKeyword =
        document.getElementById('searchCategory')
        .value
        .toLowerCase();

    const typeKeyword =
        document.getElementById('searchType')
        .value
        .toLowerCase();

    const filtered = allData.filter(item =>

        item["Title"]
        .toLowerCase()
        .includes(titleKeyword)

        &&

        item["Category"]
        .toLowerCase()
        .includes(categoryKeyword)

        &&

        item["TYPE"]
        .toLowerCase()
        .includes(typeKeyword)

    );

    renderTable(filtered);

}

/* AUTO BUTTONS */

function generateCategoryButtons(){

    const container =
        document.getElementById('categoryButtons');

    const options =
        document.querySelectorAll('#categoryList option');

    options.forEach(option => {

        const value = option.value;

        const btn = document.createElement('button');

        btn.innerText = value;

        btn.onclick = function(){

            document.getElementById(
                'searchCategory'
            ).value = value;

            filterData();

        };

        container.appendChild(btn);

    });

    /* CLEAR BUTTON */

    const clearBtn =
        document.createElement('button');

    clearBtn.innerText = 'CLEAR';

    clearBtn.style.background = '#dc3545';

    clearBtn.onclick = function(){

        document.getElementById(
            'searchTitle'
        ).value = '';

        document.getElementById(
            'searchCategory'
        ).value = '';

        document.getElementById(
            'searchType'
        ).value = '';

        filterData();

    };

    container.appendChild(clearBtn);

}

/* OPEN PDF */

function openPDF(link){

    window.location.href = link;

}

</script>

</body>
