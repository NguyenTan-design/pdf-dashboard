<body>

<h1>PDF Dashboard</h1>

<input type="text" id="searchInput" placeholder="Search title...">

<br><br>

<table id="pdfTable">

    <thead>
        <tr>
            <th>TITLE</th>
            <th>CATEGORY</th>
            <th>ACTION</th>
        </tr>
    </thead>

    <tbody id="pdfBody"></tbody>

</table>

<style>

#searchInput{
    width:100%;
    padding:12px;
    font-size:16px;
    border-radius:6px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#0078d4;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f1f1f1;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

</style>

<script>

let allData = [];

fetch('data.json')
.then(response => response.json())
.then(data => {

    allData = data;

    renderTable(data);

});

function renderTable(data){

    const body = document.getElementById('pdfBody');

    body.innerHTML = '';

    data.forEach(item => {

        const row = document.createElement('tr');

        row.innerHTML = `
            <td>${item.title}</td>
            <td>${item.category}</td>
            <td>
                <button onclick="openPDF('${item.link}')">
                    Open
                </button>
            </td>
        `;

        body.appendChild(row);

    });

}

document.getElementById('searchInput')
.addEventListener('keyup', function(){

    const keyword = this.value.toLowerCase();

    const filtered = allData.filter(item =>
        item.title.toLowerCase().includes(keyword)
    );

    renderTable(filtered);

});

function openPDF(link){
    window.location.href = link;
}

</script>

</body>
