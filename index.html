<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Dashboard</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    padding:20px;
}

h1{
    text-align:center;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

button{
    width:100%;
    background:#0078d4;
    color:white;
    border:none;
    padding:12px;
    border-radius:6px;
    cursor:pointer;
}

</style>
</head>

<body>

<h1>PDF Dashboard</h1>

<div class="container" id="pdfContainer"></div>

<script>

fetch('data.json')
.then(response => response.json())
.then(data => {

    const container = document.getElementById('pdfContainer');

    data.forEach(item => {

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
            <h3>${item.title}</h3>
            <p>${item.category}</p>

            <button onclick="openPDF('${item.link}')">
                Open PDF
            </button>
        `;

        container.appendChild(card);

    });

});

function openPDF(link){
    window.location.href = link;
}

</script>

</body>
</html>
